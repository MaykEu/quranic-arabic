<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persistence QA — Quranic Arabic</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/reading.css">
</head>
<body>
<main></main>
<script>
  window.__err = null;
  window.addEventListener('error', (e) => {
    window.__err = (e.error && e.error.stack) || e.message;
  });
  window.addEventListener('unhandledrejection', (e) => {
    window.__err = String((e.reason && e.reason.stack) || e.reason);
  });
</script>
<script type="module">
// THE persistence audit: write through every real code path the app uses for
// progress, then prove each value is (1) in localStorage, (2) inside the cloud
// sync document, (3) inside a backup file — and that the ONLY things excluded
// from each are the intentionally device-local keys.
const out = {};
const finish = () => {
  // booleans must be true; the "missing" arrays must simply be empty
  const ok = (v) => v === true || (Array.isArray(v) && v.length === 0);
  out.pass = Object.values(out).every(ok);
  const pre = document.createElement('pre');
  pre.id = 'result';
  pre.textContent = JSON.stringify(out, null, 1);
  document.body.appendChild(pre);
  document.body.dataset.qa = out.pass ? 'done-pass' : 'done-fail';
};

async function run() {
  localStorage.clear();

  const { mark, unmark } = await import('../js/lib/progress.js');
  const { review } = await import('../js/lib/srs.js');
  const { set } = await import('../js/lib/store.js');
  const { collectDoc } = await import('../js/lib/sync.js');
  const { collect } = await import('../js/lib/backup.js');
  const A = await import('../js/lib/activity.js');

  // ---- drive one write per feature, exactly as the pages do ----
  mark('letters', 'alif'); // Letters: pass a trace
  mark('words', 'b:test'); // Words: build-word success
  mark('verses', '112:1'); // Verses: tap a word (read)
  mark('memorised', '112:2'); // Verses: ✓ toggle
  mark('surahs', '112'); // Verses: whole-surah toggle
  unmark('memorised', '112:2'); // unmark → must leave a tombstone
  review('7', true); // Review/Quiz: SRS good
  review('v:112:1', false); // Recall: SRS miss
  set('practice', { listens: { '2026-10-13': 3 }, recallSingle: true }); // legacy listen map (absorbed by activity.migrate) + a selection key
  // Activity log (qa-v32) — the REAL helpers the pages call
  A.bump('listens'); // Listen drill: "I said it — next"
  A.graded('quizRead', true); // Quiz answer (correct)
  A.graded('traces', false); // Trace check (failed)
  A.bump('readSec', 300); // Reading time
  A.setBest('bestRead', 8);
  const dk = A.dayKey();
  set('brush', 9); // Trace brush size
  set('prefs', { tr: 'sahih', reciter: 'alafasy', wordMode: false });
  set('lastRead', { s: 112, a: 1, at: Date.now() });
  set('theme', 'dark'); // device-local on purpose
  set('lastBackupAt', Date.now()); // device-local on purpose
  set('sync.session', { access_token: 'x', refresh_token: 'y', user: { id: 'u' } }); // never leaves the device
  set('sync.lastSync', 1);
  set('sync.resetAt', 5);

  // ---- collect the three views ----
  const doc = collectDoc();
  const bak = collect();

  const storageKeys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('qa.v1.')) storageKeys.push(k.slice(6));
  }

  const DOC_EXCLUDED = ['theme', 'lastBackupAt', 'sync.lastSync', 'sync.resetAt', 'sync.session', 'tomb'];
  const BACKUP_EXCLUDED = ['sync.lastSync', 'sync.resetAt', 'sync.session'];

  const docDataKeys = new Set(Object.keys(doc.data)); // true data keys in the doc
  const docCovered = new Set([...docDataKeys, 'tomb']); // tomb is covered via doc.tombstones

  out.docCoversEverything = storageKeys.every((k) => docCovered.has(k) || DOC_EXCLUDED.includes(k));
  out.docExclusionsExact = DOC_EXCLUDED.every((k) => !docDataKeys.has(k)); // no excluded key leaks into doc.data
  out.docMissing = storageKeys.filter((k) => !docCovered.has(k) && !DOC_EXCLUDED.includes(k));

  out.backupCoversEverything = storageKeys.every((k) => k in bak || BACKUP_EXCLUDED.includes(k));
  out.backupExclusionsExact = BACKUP_EXCLUDED.every((k) => !(k in bak));
  out.backupMissing = storageKeys.filter((k) => !(k in bak) && !BACKUP_EXCLUDED.includes(k));

  // ---- spot checks: the values really are the data ----
  out.lettersInDoc = !!doc.data.progress.letters.alif;
  out.wordsInDoc = !!doc.data.progress.words['b:test'];
  out.versesInDoc = !!doc.data.progress.verses['112:1'];
  out.surahInDoc = !!doc.data.progress.surahs['112'];
  out.tombstoneInDoc = doc.tombstones['memorised:112:2'] > 0;
  out.srsInDoc = !!doc.data.srs['7'] && !!doc.data.srs['v:112:1'];
  out.practiceInDoc = doc.data.practice.listens['2026-10-13'] === 3;
  out.activityInDoc =
    doc.data.activity.days[dk].listens === 1 &&
    doc.data.activity.days[dk].quizRead === 1 &&
    doc.data.activity.days[dk].quizReadOk === 1 &&
    doc.data.activity.days[dk].traces === 1 &&
    doc.data.activity.days[dk].tracesOk === undefined &&
    doc.data.activity.days[dk].readSec === 300;
  out.activityBestInDoc = doc.data.activity.best.bestRead === 8;
  out.brushInDoc = doc.data.brush === 9;
  out.prefsInDoc = doc.data.prefs.tr === 'sahih';
  out.lastReadInDoc = doc.data.lastRead.s === 112;
  out.metaInDoc = !!doc.data._meta && !!doc.data._meta.progress;

  // same for the backup file
  out.allInBackup =
    !!bak.progress.letters.alif &&
    !!bak.progress.surahs['112'] &&
    !!bak.srs['7'] &&
    bak.practice.listens['2026-10-13'] === 3 &&
    bak.activity.days[dk].listens === 1 &&
    bak.activity.best.bestRead === 8 &&
    bak.brush === 9 &&
    !!bak.tomb['memorised:112:2'];

  out.sessionNotInDoc = !('sync.session' in doc.data);
  out.sessionNotInBackup = !('sync.session' in bak);

  // ---- and the merge keeps all of it: a fresh device + this doc = same data ----
  const { mergeDocs } = await import('../js/lib/sync.js');
  const merged = mergeDocs({ v: 1, updatedAt: 0, data: {}, tombstones: {} }, doc, 123);
  out.mergeKeepsSurah = !!merged.data.progress.surahs['112'];
  out.mergeKeepsTombstone = merged.tombstones['memorised:112:2'] > 0;
  out.mergeKeepsSrs = !!merged.data.srs['7'];
  out.mergeKeepsPractice = merged.data.practice.listens['2026-10-13'] === 3;
  out.mergeKeepsActivity = merged.data.activity.days[dk].listens === 1 && merged.data.activity.best.bestRead === 8;
}

run()
  .then(() => finish())
  .catch((e) => {
    const pre = document.createElement('pre');
    pre.id = 'result';
    pre.textContent = 'ERROR: ' + ((e && e.stack) || e) + '\nwindow.__err: ' + (window.__err || 'none');
    document.body.appendChild(pre);
    document.body.dataset.qa = 'done-error';
  });
</script>
</body>
</html>
