<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress page QA — Quranic Arabic</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/stats.css">
</head>
<body>
<main></main>
<script type="module">
// Progress page QA — seeds a known history, then drives the REAL page and
// checks every number against an independently computed expectation, section by
// section: Overview · Stats · Memorised · Data (hash-routed tabs).
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const q = (s) => document.querySelector(s);
const qa = (s) => [...document.querySelectorAll(s)];
const out = {};
const DAY = 86400000;

let pageError = null;
window.addEventListener('error', (e) => {
  pageError = String((e && e.error && e.error.message) || e.message || e);
});
window.addEventListener('unhandledrejection', (e) => {
  pageError = String((e && e.reason && e.reason.message) || e.reason || e);
});

const key = (d) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const tKey = key(new Date());
const yKey = key(new Date(Date.now() - DAY));
const tab = (id) => qa('.pr-tabs a').find((a) => a.getAttribute('href') === '#' + id);

async function go(id) {
  tab(id).click(); // real click → hashchange → render (the same path a menu deep link takes)
  await sleep(700);
}

async function run() {
  localStorage.clear();

  const srs = {};
  for (let r = 1; r <= 3; r++) srs[r] = { box: 5, seen: 6, right: 6, due: Date.now() + 10 * DAY }; // mature
  for (let r = 4; r <= 6; r++) srs[r] = { box: 3, seen: 4, right: 4, due: Date.now() + 5 * DAY }; // young
  for (let r = 7; r <= 9; r++) srs[r] = { box: 1, seen: 2, right: 1, due: Date.now() - 5000 }; // learning, overdue
  localStorage.setItem('qa.v1.srs', JSON.stringify(srs));

  localStorage.setItem(
    'qa.v1.activity',
    JSON.stringify({
      days: {
        [tKey]: {
          visits: 1,
          listens: 3,
          quizRead: 10,
          quizReadOk: 7,
          quizReadRounds: 1,
          traces: 12,
          tracesOk: 9,
          listenSec: 600,
          readSec: 300,
        },
        [yKey]: { visits: 1, listens: 3 },
      },
      best: { bestRead: 8 },
    }),
  );

  localStorage.setItem(
    'qa.v1.progress',
    JSON.stringify({
      letters: { alif: { at: 1 }, ba: { at: 1 }, ta: { at: 1 } },
      words: {},
      verses: {},
      memorised: {},
      surahs: {},
      days: [],
    }),
  );

  const vocab = await (await fetch('../data/vocabulary.json')).json();
  const knownTokens = vocab.words.filter((w) => srs[w.rank] && srs[w.rank].box >= 3).reduce((n, w) => n + w.count, 0);
  const expCoverage = (knownTokens / vocab.total_tokens) * 100;

  await import('../js/pages/progress.js');
  await sleep(1400);
  out.noError = !pageError;

  // ---------- tab bar ----------
  const tabs = qa('.pr-tabs a');
  out.fourTabs = tabs.length === 4;
  // Guard against the "stylesheet not linked on this page" trap: the seg must be
  // STYLED, not a row of raw inline links (that is how it shipped once).
  out.tabsStyled = getComputedStyle(q('.pr-tabs')).display === 'flex' && parseFloat(getComputedStyle(tabs[0]).borderRadius) > 0;
  out.tabHrefs =
    tabs.map((a) => a.getAttribute('href')).join(',') === '#overview,#stats,#memorised,#data';
  out.overviewDefault = tab('overview').classList.contains('active');

  // ---------- Overview ----------
  out.ovGoal = /25/.test(q('.goal-line').textContent) && /\/ 30 reps/.test(q('.goal-line').textContent);
  out.ovGoalBar = Math.abs(parseFloat(q('.goal-bar i').style.width) - 83) <= 1;
  out.ovGoalNotDone = !q('.goal-done');
  out.ovDaysUsed = /2 days used/.test(document.body.textContent);
  out.ovTiles =
    q('.stat-grid').textContent.includes('3/28') &&
    q('.stat-grid').textContent.includes('6') &&
    q('.stat-grid').textContent.includes('Words known');
  const covShown = parseFloat(q('.cov-num b').textContent);
  out.ovCoverageMatches = Math.abs(covShown - expCoverage) <= 0.1;
  out.ovCoverageTicks = qa('.cov-tick').length === 2;
  out.ovDue = /3 reviews ready/.test(document.body.textContent) && !!q('a[href="words.html#review"]');
  out.ovOnlyOverview = !q('.drill-table') && !q('.heat') && !q('#export'); // the heavy stuff is NOT here

  // goal preset writes through
  qa('.chip-pick[data-goal]').find((b) => b.dataset.goal === '15').click();
  await sleep(500);
  out.ovGoalSaved = JSON.parse(localStorage.getItem('qa.v1.prefs')).dailyGoalReps === 15;
  out.ovGoalDoneNow = !!q('.goal-done');

  // ---------- Stats ----------
  await go('stats');
  out.stActive = tab('stats').classList.contains('active');
  const bucketVals = qa('.bucket b').map((b) => Number(b.textContent));
  out.stBuckets = JSON.stringify(bucketVals) === JSON.stringify([491, 3, 3, 3]);
  const bucketHrefs = qa('.bucket').map((a) => a.getAttribute('href'));
  out.stBucketLinks =
    bucketHrefs.includes('words.html#review/b12') &&
    bucketHrefs.includes('words.html#review/b34') &&
    bucketHrefs.includes('words.html#review/b5');
  out.stForecastToday = /3 due today/.test(document.body.textContent);
  out.stForecastWeek = /3 in the next 7 days/.test(document.body.textContent);
  out.stForecastBars = qa('.forecast i').length === 30;
  const rows = qa('.drill-table tr').map((r) => r.textContent.replace(/\s+/g, ' ').trim());
  out.stDrillRows = rows.length === 5 && /Read it/.test(rows[0]) && /Understand it/.test(rows[1]);
  out.stReadRow = /1 round/.test(rows[0]) && /best 8\/10/.test(rows[0]) && /10 answers · 70%/.test(rows[0]);
  out.stTraceRow = /12 checks/.test(rows[2]) && /9 passed/.test(rows[2]);
  out.stOverall = /73%/.test(document.body.textContent) && /22/.test(document.body.textContent);
  out.stLetters = qa('.ltr-chip').length === 28 && qa('.ltr-chip.on').length === 3;
  const heatSpans = qa('.heat .heat-col span');
  out.stHeatCells = heatSpans.length >= 84;
  out.stHeatToday = heatSpans[heatSpans.length - 1].className === 'l2';
  out.stVolume = /10 min/.test(document.body.textContent) && /5 min/.test(document.body.textContent);
  out.stNoGoal = !q('.goal-line'); // Overview's daily card stays out of Stats

  // ---------- Memorised ----------
  await go('memorised');
  out.memActive = tab('memorised').classList.contains('active');
  out.memEmpty = /Nothing yet/.test(document.body.textContent) && !q('.goal-line') && !q('.heat');

  // ---------- Data ----------
  await go('data');
  out.dataActive = tab('data').classList.contains('active');
  out.dataCards = !!q('#export') && !!q('#import') && !!q('#reset') && !!q('#file');
  out.dataSyncLine = /Cloud sync/.test(document.body.textContent);
  out.dataNoHeat = !q('.heat');

  // ---------- deep link (what the account menu rows use) ----------
  location.hash = '#stats';
  await sleep(700);
  out.deepLinkStats = !!q('.drill-table') && tab('stats').classList.contains('active');
}

run()
  .then(() => {
    out.pass = Object.values(out).every((v) => v === true);
    const pre = document.createElement('pre');
    pre.id = 'result';
    pre.textContent = JSON.stringify(out, null, 1);
    document.body.appendChild(pre);
    document.body.dataset.qa = out.pass ? 'done-pass' : 'done-fail';
  })
  .catch((e) => {
    const pre = document.createElement('pre');
    pre.id = 'result';
    pre.textContent = 'ERROR: ' + ((e && e.stack) || e);
    document.body.appendChild(pre);
    document.body.dataset.qa = 'done-error';
  });
</script>
</body>
</html>
