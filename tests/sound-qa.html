<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz QA — Quranic Arabic</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/reading.css">
</head>
<body>
<main></main>
<script type="module">
// Practice → Quiz, both modes. Rules under test:
//   • nothing plays on its own (counting real media play() calls)
//   • the four options are visible from the start and after every advance
//   • "Write it" shows Arabic, "Meaning" shows English glosses
//   • progress dots update, and the round ends with a recap of missed words
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const out = {};
const q = (s) => document.querySelector(s);
const store = (k) => JSON.parse(localStorage.getItem('qa.v1.' + k) || '{}');

let playCalls = 0;
const realPlay = HTMLMediaElement.prototype.play;
HTMLMediaElement.prototype.play = function () {
  playCalls += 1;
  return realPlay.call(this).catch(() => {});
};

async function run() {
  localStorage.clear();
  history.replaceState(null, '', '#quiz');
  await import('../js/pages/practice.js');
  await sleep(1400);

  out.quizRenders = document.querySelectorAll('.sound-opt').length === 4;
  out.noAutoplayOnEntry = playCalls === 0;
  out.optionsVisibleImmediately = getComputedStyle(q('#options')).display !== 'none';
  out.modeSeg = !!q('.quiz-seg [data-qmode="write"]') && !!q('.quiz-seg [data-qmode="meaning"]');
  out.writeModeActive = q('.quiz-seg [data-qmode="write"]').classList.contains('active');
  out.dotsInitial = document.querySelectorAll('.q-dots .q-dot').length === 1;

  q('#replay').click();
  await sleep(250);
  out.hearPlays = playCalls === 1;

  document.querySelectorAll('.sound-opt')[0].click();
  await sleep(350);
  out.feedbackShown = q('#sound-feedback').textContent.trim().length > 0;
  out.dotUpdated = document.querySelectorAll('.q-dots .q-dot.good, .q-dots .q-dot.bad').length === 1;
  out.optionsDisabledAfterAnswer = [...document.querySelectorAll('.sound-opt')].every((b) => b.disabled);

  await sleep(2100);
  out.advancedWithOptions =
    document.querySelectorAll('.sound-opt').length === 4 && getComputedStyle(q('#options')).display !== 'none';
  out.noAutoplayOnAdvance = playCalls === 1; // still only the one manual press
  out.srsAfterFirst = Object.keys(store('srs')).length >= 1;

  // Meaning mode
  q('.quiz-seg [data-qmode="meaning"]').click();
  await sleep(450);
  out.meaningActive = q('.quiz-seg [data-qmode="meaning"]').classList.contains('active');
  const glossOpts = [...document.querySelectorAll('.sound-opt.gloss-opt')];
  out.glossOptions = glossOpts.length === 4;
  const glossTexts = glossOpts.map((b) => b.textContent.trim());
  out.glossUnique = new Set(glossTexts).size === 4;
  out.glossLatin = glossTexts.every((t) => /^[A-Za-z ,'().-]+$/.test(t));
  out.prefSaved = store('prefs').quizMode === 'meaning';

  const srsBefore = Object.keys(store('srs')).length;
  document.querySelectorAll('.sound-opt')[0].click();
  await sleep(2200);
  out.srsGrew = Object.keys(store('srs')).length >= srsBefore;
  out.stillMeaningMode = q('.quiz-seg [data-qmode="meaning"]')?.classList.contains('active') === true;

  // finish the round
  for (let i = 0; i < 9; i++) {
    const opts = [...document.querySelectorAll('.sound-opt')];
    if (!opts.length) break;
    opts[0].click();
    await sleep(2200);
  }
  await sleep(400);
  out.doneScreen = /Round done/.test(document.body.textContent);
  out.doneRecap = !!q('#again') && /clean round|Missed words come back/i.test(document.body.textContent);
}

run()
  .then(() => {
    out.pass = Object.values(out).every((v) => v === true);
    const pre = document.createElement('pre');
    pre.id = 'result';
    pre.textContent = JSON.stringify(out, null, 1);
    document.body.appendChild(pre);
    document.body.dataset.qa = out.pass ? 'done-pass' : 'done-fail';
  })
  .catch((e) => {
    const pre = document.createElement('pre');
    pre.id = 'result';
    pre.textContent = 'ERROR: ' + ((e && e.stack) || e);
    document.body.appendChild(pre);
    document.body.dataset.qa = 'done-error';
  });
</script>
</body>
</html>
