<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz QA — Quranic Arabic</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/reading.css">
</head>
<body>
<main></main>
<script type="module">
// Practice → Quiz: two independent quizzes sharing one word pool.
// Rules under test:
//   • nothing plays on its own (real media play() calls are counted)
//   • options visible from the start and after every advance
//   • "Read it" = Arabic script · "Understand it" = English glosses
//   • the two modes keep SEPARATE rounds, scores and dots
//   • the round ends with a recap of missed words
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const out = {};
const q = (s) => document.querySelector(s);
const counter = () => q('.counter-chip').textContent.trim();
const dots = () => document.querySelectorAll('.q-dots .q-dot').length;
const answerFirst = async () => {
  const opts = [...document.querySelectorAll('.sound-opt')];
  if (!opts.length) return false;
  opts[0].click();
  await sleep(2400);
  return true;
};

let playCalls = 0;
const realPlay = HTMLMediaElement.prototype.play;
HTMLMediaElement.prototype.play = function () {
  playCalls += 1;
  return realPlay.call(this).catch(() => {});
};

async function run() {
  localStorage.clear();
  history.replaceState(null, '', '#quiz');
  await import('../js/pages/practice.js');
  await sleep(1400);

  out.quizRenders = document.querySelectorAll('.sound-opt').length === 4;
  out.noAutoplayOnEntry = playCalls === 0;
  out.optionsVisibleImmediately = getComputedStyle(q('#options')).display !== 'none';
  out.modeSeg = !!q('.quiz-seg [data-qmode="read"]') && !!q('.quiz-seg [data-qmode="meaning"]');
  out.labels = q('.quiz-seg [data-qmode="read"]').textContent.trim() === 'Read it' &&
    q('.quiz-seg [data-qmode="meaning"]').textContent.trim() === 'Understand it';
  out.readModeActive = q('.quiz-seg [data-qmode="read"]').classList.contains('active');
  out.readStartsAtOne = counter() === '1 / 10';
  out.dotsInitial = dots() === 1;

  q('#replay').click();
  await sleep(250);
  out.hearPlays = playCalls === 1;

  // ---- Read it: answer two questions ----
  await answerFirst();
  out.advancedWithOptions = document.querySelectorAll('.sound-opt').length === 4;
  out.noAutoplayOnAdvance = playCalls === 1;
  await answerFirst();
  out.readAtThree = counter() === '3 / 10' && dots() === 3;

  // ---- switch: Understand it must start its OWN round ----
  q('.quiz-seg [data-qmode="meaning"]').click();
  await sleep(450);
  out.meaningActive = q('.quiz-seg [data-qmode="meaning"]').classList.contains('active');
  out.meaningOwnRound = counter() === '1 / 10' && dots() === 1;
  const glossOpts = [...document.querySelectorAll('.sound-opt.gloss-opt')];
  out.glossOptions = glossOpts.length === 4;
  out.glossLatin = glossOpts.every((b) => !/[\u0600-\u06FF]/.test(b.textContent)); // English options, never Arabic script
  out.glossUnique = new Set(glossOpts.map((b) => b.textContent.trim())).size === 4;
  out.prefSaved = JSON.parse(localStorage.getItem('qa.v1.prefs') || '{}').quizMode === 'meaning';

  await answerFirst();
  out.meaningAtTwo = counter() === '2 / 10';

  // ---- back to Read it: its own progress must be untouched ----
  q('.quiz-seg [data-qmode="read"]').click();
  await sleep(450);
  out.readPreserved = counter() === '3 / 10' && dots() === 3;
  out.readStillArabic = document.querySelectorAll('.sound-opt.gloss-opt').length === 0;

  // ---- finish the Meaning round (9 more answers) ----
  q('.quiz-seg [data-qmode="meaning"]').click();
  await sleep(450);
  out.meaningPreserved = counter() === '2 / 10';
  for (let i = 0; i < 9; i++) {
    const ok = await answerFirst();
    if (!ok) break;
  }
  await sleep(400);
  out.doneScreen = /Round done/.test(document.body.textContent);
  out.doneNamesMode = /Understand it ·/.test(document.body.textContent);
  out.doneRecap = !!q('#again') && /clean round|Missed words come back/i.test(document.body.textContent);

  // ---- another round restarts only this quiz ----
  q('#again').click();
  await sleep(450);
  out.meaningRestarted = counter() === '1 / 10';
  q('.quiz-seg [data-qmode="read"]').click();
  await sleep(450);
  out.readStillAtThree = counter() === '3 / 10';
  out.stillNoAutoplay = playCalls === 1;
}

run()
  .then(() => {
    out.pass = Object.values(out).every((v) => v === true);
    const pre = document.createElement('pre');
    pre.id = 'result';
    pre.textContent = JSON.stringify(out, null, 1);
    document.body.appendChild(pre);
    document.body.dataset.qa = out.pass ? 'done-pass' : 'done-fail';
  })
  .catch((e) => {
    const pre = document.createElement('pre');
    pre.id = 'result';
    pre.textContent = 'ERROR: ' + ((e && e.stack) || e);
    document.body.appendChild(pre);
    document.body.dataset.qa = 'done-error';
  });
</script>
</body>
</html>
