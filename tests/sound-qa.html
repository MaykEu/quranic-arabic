<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz (ear training) QA — Quranic Arabic</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/reading.css">
</head>
<body>
<main></main>
<script type="module">
// Drive the real Practice page in Quiz mode. New rules under test: nothing plays
// on its own and the options stay hidden until the learner presses play.
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const out = {};
const q = (s) => document.querySelector(s);

localStorage.clear();
history.replaceState(null, '', '#quiz');
await import('../js/pages/practice.js');
await sleep(1200);

out.modeActive = !!q('.sound-grid');
out.counter = q('.counter-chip')?.textContent?.trim();

// before pressing play: options hidden, button asks to hear it, no player audio
out.hiddenBeforePlay = getComputedStyle(q('#options')).display === 'none';
out.hearButton = /Hear the word/.test(q('#replay').textContent);
out.feedbackPrompt = /Press/.test(q('#sound-feedback').textContent);
out.playerIdle = !q('.player-bar .bar-title') || !/playing/i.test(document.body.textContent);

q('#replay').click();
await sleep(250);
out.optionsVisibleAfterPlay = getComputedStyle(q('#options')).display !== 'none';
out.buttonAfterPlay = /Play it again/.test(q('#replay').textContent);

const opts = [...document.querySelectorAll('.sound-opt')];
out.optionCount = opts.length;
const ranks = opts.map((b) => b.dataset.rank);
out.uniqueOptions = new Set(ranks).size === ranks.length && ranks.every((r) => r);

// answer the first option (right or wrong — both paths must grade + reveal)
opts[0].click();
await sleep(400);
out.feedbackShown = q('#sound-feedback').textContent.trim().length > 0;
out.marked = document.querySelectorAll('.sound-opt.correct, .sound-opt.wrong').length >= 1;
out.optionsDisabled = [...document.querySelectorAll('.sound-opt')].every((b) => b.disabled);
out.srsCount = Object.keys(JSON.parse(localStorage.getItem('qa.v1.srs') || '{}')).length;

// second click must be ignored (no double grading)
const srsBefore = out.srsCount;
document.querySelectorAll('.sound-opt')[1].click();
await sleep(120);
out.noDoubleGrade = Object.keys(JSON.parse(localStorage.getItem('qa.v1.srs') || '{}')).length === srsBefore;

// advances to the next question — and that one also waits for a press
await sleep(1800);
out.advanced = q('.counter-chip')?.textContent?.trim() !== out.counter && !!q('.sound-grid');
out.nextQuestionHiddenAgain =
  getComputedStyle(q('#options')).display === 'none' && /Hear the word/.test(q('#replay').textContent);

out.pass = [
  out.modeActive, out.hiddenBeforePlay, out.hearButton, out.feedbackPrompt,
  out.optionsVisibleAfterPlay, out.buttonAfterPlay, out.optionCount === 4, out.uniqueOptions,
  out.feedbackShown, out.marked, out.optionsDisabled, out.srsCount >= 1, out.noDoubleGrade,
  out.advanced, out.nextQuestionHiddenAgain,
].every((v) => v === true);

const pre = document.createElement('pre');
pre.id = 'result';
pre.textContent = JSON.stringify(out, null, 1);
document.body.appendChild(pre);
document.body.dataset.qa = out.pass ? 'done-pass' : 'done-fail';
</script>
</body>
</html>
