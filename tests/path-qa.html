<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Path QA — Quranic Arabic</title>
</head>
<body>
<pre id="result">running…</pre>
<script type="module">
// Seeds localStorage states, then exercises path.js: stage detection + plan.
const mode = new URLSearchParams(location.search).get('mode') || 'fresh';
const put = (k, v) => localStorage.setItem('qa.v1.' + k, JSON.stringify(v));

localStorage.clear();
if (mode === 'letters-done') {
  const letters = {};
  for (let i = 1; i <= 28; i++) letters['L' + i] = { at: Date.now() };
  put('progress', { letters, verses: {}, days: [] });
  const srs = {};
  for (let i = 1; i <= 60; i++) srs[String(i)] = { box: 2, due: 0, at: Date.now() };
  srs['b:40'] = { box: 1, due: 0, at: Date.now() };
  srs['b:39'] = { box: 1, due: 0, at: Date.now() };
  srs['b:38'] = { box: 1, due: 0, at: Date.now() };
  put('srs', srs);
  put('practice', { day: new Date().toISOString().slice(0, 10), count: 4 });
  put('lastRead', { s: 2, a: 255 });
}
if (mode === 'reading') {
  const letters = {};
  for (let i = 1; i <= 28; i++) letters['L' + i] = { at: Date.now() };
  put('progress', { letters, verses: { '1:1': { at: Date.now() } }, days: [] });
  const srs = {};
  for (let i = 1; i <= 120; i++) srs[String(i)] = { box: 3, due: 0, at: Date.now() };
  put('srs', srs);
}

const { todayPlan, detectStage, stats } = await import('../js/lib/path.js');
const plan = todayPlan();
const out = {
  mode,
  detected: detectStage(stats()),
  stage: plan.stage,
  blocks: plan.blocks.map((b) => ({ id: b.id, href: b.href, cta: b.cta })),
  stats: plan.stats,
};
document.getElementById('result').textContent = JSON.stringify(out, null, 1);
document.body.dataset.qa = 'done';
</script>
</body>
</html>
